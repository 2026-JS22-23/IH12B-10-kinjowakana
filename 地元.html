        var map;
        var markers = {};
        var infoWindow;
        var geocoder;
        var currentSpotId = null;

        function initMap() {
            var okinawaCenter = { lat: 26.350, lng: 127.820 }; 
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 12, 
                center: okinawaCenter
            });

            infoWindow = new google.maps.InfoWindow();
            geocoder = new google.maps.Geocoder();

            spots.forEach(function(spot) {
                if (spot.comment.includes("行ったことないからよくわからないごめん！")) {
                    spot.img = notVisitedImg;
                }

                var searchQuery = spot.address + " " + spot.name;
                
                geocoder.geocode({ address: searchQuery }, function(results, status) {
                    if (status === 'OK' && results[0]) {
                        var location = results[0].geometry.location;
                        
                        var marker = new google.maps.Marker({
                            position: location,
                            map: map,
                            title: spot.name
                        });

                        markers[spot.id] = marker;

                        marker.addListener("click", function() {
                            selectShop(spot, marker, location);
                        });
                    } else {
                        geocoder.geocode({ address: spot.address }, function(res, stat) {
                            if (stat === 'OK' && res[0]) {
                                var loc = res[0].geometry.location;
                                var marker = new google.maps.Marker({
                                    position: loc,
                                    map: map,
                                    title: spot.name
                                });
                                markers[spot.id] = marker;
                                marker.addListener("click", function() {
                                    selectShop(spot, marker, loc);
                                });
                            }
                        });
                    }
                });
            });

            renderShopList();
        }

        function selectShop(spot, marker, location) {
            currentSpotId = spot.id;

            var googleSearchUrl = "https://www.google.com/search?q=" + encodeURIComponent(spot.name + " " + spot.region);

            var imageHtml = spot.img ? `<img src="${spot.img}" alt="${spot.name}" class="info-img">` : '';

            var contentString = `
                <div class="info-content">
                    <h3>${spot.name}</h3>
                    ${imageHtml}
                    <div><span class="info-label">営業時間:</span> ${spot.hours}</div>
                    <div><span class="info-label">住所:</span> ${spot.address}</div>
                    <div><span class="info-label">TEL:</span> ${spot.phone}</div>
                    <a href="${googleSearchUrl}" target="_blank" class="detail-btn">詳しく見る</a>
                </div>
            `;
            infoWindow.setContent(contentString);
            infoWindow.open(map, marker);

            $("#commentShopName").text(spot.name);
            $("#commentContent").text(spot.comment || "（このお店のコメントはまだ記入されていません）");
            
            renderBbsComments(spot.id);

            $("#commentContainer").slideDown();

            $('html, body').animate({ scrollTop: 0 }, 'slow');
            if (location) {
                map.panTo(location);
            } else if (marker) {
                map.panTo(marker.getPosition());
            }
            map.setZoom(15);
        }

        function renderBbsComments(spotId) {
            var storageKey = "bbs_comments_" + spotId;
            var comments = JSON.parse(localStorage.getItem(storageKey) || "[]");
            var listEl = $("#bbsList");
            listEl.empty();

            if (comments.length === 0) {
                listEl.append('<div class="bbs-item" style="color: #888;">まだ口コミはありません。</div>');
            } else {
                comments.forEach(function(c) {
                    listEl.append(`<div class="bbs-item">匿名さん: ${escapeHtml(c)}</div>`);
                });
            }
        }

        $("#submitCommentBtn").on("click", function() {
            if (currentSpotId === null) return;
            var text = $("#userCommentInput").val().trim();
            if (!text) return;

            var storageKey = "bbs_comments_" + currentSpotId;
            var comments = JSON.parse(localStorage.getItem(storageKey) || "[]");
            comments.push(text);
            localStorage.setItem(storageKey, JSON.stringify(comments));

            $("#userCommentInput").val("");
            renderBbsComments(currentSpotId);
        });

        function escapeHtml(str) {
            return $('<div>').text(str).html();
        }

        function renderShopList() {
            var regions = ["うるま市", "沖縄市", "北中城村"];
            var container = $("#shopContainer");
            container.empty();

            regions.forEach(function(region) {
                var regionShops = spots.filter(s => s.region === region);
                if (regionShops.length === 0) return;

                var sectionHtml = `
                    <div class="region-section">
                        <div class="region-title"> ${region}</div>
                        <div class="shop-grid" id="grid-${region}"></div>
                    </div>
                `;
                container.append(sectionHtml);

                var grid = $(`#grid-${region}`);
                regionShops.forEach(function(spot) {
                    var cardHtml = `
                        <div class="shop-card" data-id="${spot.id}">
                            <div class="shop-name">${spot.name}</div>
                            <div class="shop-info">
                                <div><span class="info-label">営業時間:</span> ${spot.hours}</div>
                                <div><span class="info-label">住所:</span> ${spot.address}</div>
                                <div><span class="info-label">TEL:</span> ${spot.phone}</div>
                            </div>
                        </div>
                    `;
                    grid.append(cardHtml);
                });
            });

            $(".shop-card").on("click", function() {
                var id = $(this).data("id");
                var targetSpot = spots[id];
                var targetMarker = markers[id];

                selectShop(targetSpot, targetMarker);
            });
        }
    </script>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCAKLjisxFelKwIl1_G6MiEO9-ya7Twr5s&callback=initMap" async defer></script>

</body>
